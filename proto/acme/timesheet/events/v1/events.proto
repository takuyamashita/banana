syntax = "proto3";

// 勤怠(timesheet)サービスが、他のサービスに知らせる出来事。
//
// キューに流す封筒の payload に、このメッセージを proto の JSON 形で入れる(acme.payroll.events.v1 と同じ決まり)
package acme.timesheet.events.v1;

// event_type: timesheet.approved(aggregate_type: timesheet)
// 派遣社員の月の勤務表が承認され、その月の案件ごとの稼働が決まった
message TimesheetApproved {
  int64 timesheet_id = 1;
  int64 staff_id = 2;
  int32 year = 3;
  int32 month = 4;
  // 案件ごとの稼働の合計(分)。稼働のない案件は入れない
  repeated ProjectWork work = 5;
  // 承認した日時(RFC 3339)
  string approved_at = 6;
}

message ProjectWork {
  int64 project_id = 1;
  int32 work_minutes = 2;
}
