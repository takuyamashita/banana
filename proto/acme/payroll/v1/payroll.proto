syntax = "proto3";

package acme.payroll.v1;

// 給与明細の作成・確定と参照
service PayrollService {
  // 派遣社員の月次給与明細を作成中として作る。管理者のみ
  rpc CreatePayslip(CreatePayslipRequest) returns (CreatePayslipResponse);
  // 作成中の給与明細を確定する。管理者のみ
  rpc FinalizePayslip(FinalizePayslipRequest) returns (FinalizePayslipResponse);
  // 給与明細を1件取得する。管理者か、明細の本人のみ(本人は確定済みだけ)
  rpc GetPayslip(GetPayslipRequest) returns (GetPayslipResponse);
  // 派遣社員の給与明細を一覧する。管理者か、本人のみ(本人は確定済みだけ)
  rpc ListPayslips(ListPayslipsRequest) returns (ListPayslipsResponse);
}

message CreatePayslipRequest {
  int64 staff_id = 1;
  int32 pay_year = 2;
  int32 pay_month = 3;
  repeated PayslipLineInput lines = 4;
}

message PayslipLineInput {
  int64 project_id = 1;
  uint32 work_minutes = 2;
  int64 hourly_rate = 3;
}

message CreatePayslipResponse {
  int64 payslip_id = 1;
}

message FinalizePayslipRequest {
  int64 payslip_id = 1;
}

message FinalizePayslipResponse {}

message GetPayslipRequest {
  int64 payslip_id = 1;
}

message GetPayslipResponse {
  Payslip payslip = 1;
}

message ListPayslipsRequest {
  int64 staff_id = 1;
}

message ListPayslipsResponse {
  repeated Payslip payslips = 1;
}

message Payslip {
  int64 payslip_id = 1;
  int64 staff_id = 2;
  int32 pay_year = 3;
  int32 pay_month = 4;
  PayslipStatus status = 5;
  int64 total_yen = 6;
  repeated PayslipLine lines = 7;
}

message PayslipLine {
  int64 project_id = 1;
  uint32 work_minutes = 2;
  int64 hourly_rate = 3;
  int64 amount_yen = 4;
}

enum PayslipStatus {
  PAYSLIP_STATUS_UNSPECIFIED = 0;
  PAYSLIP_STATUS_DRAFT = 1;
  PAYSLIP_STATUS_FINALIZED = 2;
}
