version: v2
clean: true
# プラグインの版は固定する(固定しないと最新版が使われ、proto と関係のない変更で生成コードの差分が出る)。
# 上げるときは Cargo の prost・tonic、package.json の @bufbuild/protobuf とそろえる
plugins:
  # Rust: メッセージ(prost)・サービス(tonic)・モジュールをまとめる include ファイル
  - remote: buf.build/community/neoeinstein-prost:v0.5.0
    out: backend/gen/src/gen
  - remote: buf.build/community/neoeinstein-tonic:v0.5.0
    out: backend/gen/src/gen
  - remote: buf.build/community/neoeinstein-prost-crate:v0.5.0
    out: backend/gen/src/gen
    opt:
      - no_features
  # TS: Connect-ES v2 はメッセージとサービス記述子を protoc-gen-es だけで生成する
  - remote: buf.build/bufbuild/es:v2.15.0
    out: frontend/packages/api-client/src/gen
    opt:
      - target=ts
      # メッセージの JSON 形の型(<Message>Json)も作る。URL の引数やフォームの入力を、この型で扱う
      - json_types=true
