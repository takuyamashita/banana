# ローカルの依存サービス。タグは 2026-09-19 に実在を確認して固定した
# (mysql は RDS/Aurora のバージョンに合わせる)
#
# プロジェクト名と公開ポートは環境変数で変えられる(未設定なら下の既定値)。
# worktree ごとに別の組を立てるときは mise run worktree:new が .env.worktree に書き、mise が読み込む
name: ${COMPOSE_NAME:-banana}

services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_USER: platform
      MYSQL_PASSWORD: platform
      MYSQL_DATABASE: platform
    command:
      # 時刻はUTCで保存し、表示側で変換する
      - --default-time-zone=+00:00
    ports:
      - "${MYSQL_PORT:-3306}:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uplatform -pplatform --silent"]
      interval: 5s
      timeout: 3s
      retries: 10

  # S3の代替。serverコマンドでmaster/volume/filer/s3を一つのコンテナにまとめる。
  # volumeの8080は公開しない(S3ゲートウェイが内部で中継する)
  seaweedfs:
    image: chrislusf/seaweedfs:4.47
    command: server -dir=/data -s3 -ip.bind=0.0.0.0
    ports:
      - "${S3_PORT:-8333}:8333" # S3 API
      - "${SEAWEED_FILER_PORT:-8888}:8888" # Filer
      - "${SEAWEED_MASTER_PORT:-9333}:9333" # Master UI
    volumes:
      - seaweedfs-data:/data

  # SQSの代替。キューは compose/elasticmq.conf で事前定義する
  elasticmq:
    image: softwaremill/elasticmq-native:1.7.1
    ports:
      - "${ELASTICMQ_PORT:-9324}:9324" # SQS API
    volumes:
      - ./compose/elasticmq.conf:/opt/elasticmq.conf:ro

  # Cognitoの代替。トークン発行と管理APIの両方をローカルで賄う
  keycloak:
    image: quay.io/keycloak/keycloak:26.7.4
    command: start-dev --import-realm
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin
      KC_HEALTH_ENABLED: "true"
      # realm 定義(keycloak-realm.json)の ${WEB_PORT} に入る。ログイン後に戻る画面のポート
      WEB_PORT: ${WEB_PORT:-5173}
    # イメージに curl がないので bash の /dev/tcp で管理ポート(9000)の /health/ready を叩く。
    # これで docker compose up --wait が realm import 完了まで待つ
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          exec 3<>/dev/tcp/127.0.0.1/9000 &&
          printf 'GET /health/ready HTTP/1.1\r\nHost: localhost\r\nConnection: close\r\n\r\n' >&3 &&
          grep -q '"UP"' <&3
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 10s
    ports:
      - "${KEYCLOAK_PORT:-8080}:8080"
    volumes:
      - ./compose/keycloak-realm.json:/opt/keycloak/data/import/realm.json:ro

  # CloudWatch + X-Ray のローカル代替。アプリはOTLPをここに向けるだけ
  jaeger:
    image: jaegertracing/jaeger:2.21.0
    ports:
      - "${OTLP_GRPC_PORT:-4317}:4317" # OTLP gRPC
      - "${OTLP_HTTP_PORT:-4318}:4318" # OTLP HTTP
      - "${JAEGER_UI_PORT:-16686}:16686" # Jaeger UI

volumes:
  mysql-data:
  seaweedfs-data:
