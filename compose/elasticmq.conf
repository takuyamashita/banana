include classpath("application.conf")

node-address {
  protocol = http
  host = localhost
  port = 9324
}

rest-sqs {
  enabled = true
  bind-port = 9324
  bind-hostname = "0.0.0.0"
}

# 受け手ごとのキュー(AWS では SNS の FIFO トピックが配る。ローカルは relay が直接送る)。
# relay は MessageGroupId・MessageDeduplicationId を付けるので FIFO キューにする。
# AWS と同じく、5回受け取っても処理できなかったメッセージは DLQ に移す
queues {
  # 給与の出来事(給与明細の確定)→ 振込(payout-dispatcher)
  "payroll-payout.fifo" {
    defaultVisibilityTimeout = 30 seconds
    fifo = true
    contentBasedDeduplication = false
    deadLettersQueue {
      name = "payroll-payout-dlq.fifo"
      maxReceiveCount = 5
    }
  }
  "payroll-payout-dlq.fifo" {
    fifo = true
  }
  # 給与の出来事(派遣社員の登録・案件の登録)→ 勤怠(timesheet)
  "timesheet-inbox.fifo" {
    defaultVisibilityTimeout = 30 seconds
    fifo = true
    contentBasedDeduplication = false
    deadLettersQueue {
      name = "timesheet-inbox-dlq.fifo"
      maxReceiveCount = 5
    }
  }
  "timesheet-inbox-dlq.fifo" {
    fifo = true
  }
  # 勤怠の出来事(勤務表の承認)→ 給与(payroll)
  "payroll-inbox.fifo" {
    defaultVisibilityTimeout = 30 seconds
    fifo = true
    contentBasedDeduplication = false
    deadLettersQueue {
      name = "payroll-inbox-dlq.fifo"
      maxReceiveCount = 5
    }
  }
  "payroll-inbox-dlq.fifo" {
    fifo = true
  }
}
