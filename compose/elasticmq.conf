include classpath("application.conf")

node-address {
  protocol = http
  host = localhost
  port = 9324
}

rest-sqs {
  enabled = true
  bind-port = 9324
  bind-hostname = "0.0.0.0"
}

queues {
  # relay は MessageGroupId・MessageDeduplicationId を付けるので FIFO キューにする
  "payroll-events.fifo" {
    defaultVisibilityTimeout = 30 seconds
    fifo = true
    contentBasedDeduplication = false
  }
}
