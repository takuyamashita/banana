include classpath("application.conf")

node-address {
  protocol = http
  host = localhost
  port = 9324
}

rest-sqs {
  enabled = true
  bind-port = 9324
  bind-hostname = "0.0.0.0"
}

queues {
  # relay は MessageGroupId・MessageDeduplicationId を付けるので FIFO キューにする
  "payroll-events.fifo" {
    defaultVisibilityTimeout = 30 seconds
    fifo = true
    contentBasedDeduplication = false
    # AWS と同じく、5回受け取っても処理できなかったメッセージは DLQ に移す
    deadLettersQueue {
      name = "payroll-events-dlq.fifo"
      maxReceiveCount = 5
    }
  }
  "payroll-events-dlq.fifo" {
    fifo = true
  }
}
