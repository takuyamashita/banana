# dev 環境。インフラが決める値(issuer・Cognito の ID・キュー URL・CORS の許可元・シークレット ID)は
# Terraform が環境変数(APP__*)で渡すので、ここには書かない
[auth]
provider = "cognito"

[payout]
provider = "bank"
base_url = "https://bank-api.dev.example.com"

[telemetry]
# ADOT collector(ECS はサイドカー、Lambda はレイヤー)
otlp_endpoint = "http://localhost:4317"
