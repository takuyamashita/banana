# ローカル開発(compose.yaml の依存サービス)向け。ここに本番の秘密情報は書かない
[server]
# 給与サービス(50051)と同時に動かすので、別のポートにする
addr = "0.0.0.0:50052"
cors_allowed_origins = ["http://localhost:5173"]
shutdown_grace_seconds = 2

[database]
url = "mysql://timesheet:timesheet@127.0.0.1:3306/timesheet"

[auth]
provider = "keycloak"
issuer = "http://localhost:8080/realms/platform"
audience = "platform-api"

[messaging]
# SNS の代わりに、勤怠の出来事の受け手(給与)のキューへ直接送る
publish_queue_urls = ["http://localhost:9324/000000000000/payroll-inbox.fifo"]
inbox_queue_url = "http://localhost:9324/000000000000/timesheet-inbox.fifo"
sqs_endpoint = "http://localhost:9324"

[telemetry]
otlp_endpoint = "http://localhost:4317"
json_logs = false
log_filter = "info,sqlx=warn"
