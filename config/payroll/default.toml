# 給与(payroll)サービスの、全環境共通の既定値。バイナリに埋め込み、APP_ENV の {env}.toml と
# 環境変数(PAYROLL__SECTION__KEY)で上書きする
[server]
addr = "0.0.0.0:50051"
cors_allowed_origins = []
shutdown_grace_seconds = 20

[database]
# 接続文字列はシークレット。環境変数 PAYROLL__DATABASE__URL か secrets.database_url_secret_id で与える
url = ""
max_connections = 10

[auth]
# keycloak | cognito
provider = "cognito"
issuer = ""
# keycloak: aud に入る API 識別子 / cognito: アプリクライアントID
audience = "platform-api"
cognito_client_id = ""

# 派遣社員のログインの作成・無効化(UserDirectory)。認証基盤は auth.provider と同じ
[user_directory]
cognito_user_pool_id = ""
keycloak_base_url = ""
keycloak_realm = ""
keycloak_admin_client_id = ""
keycloak_admin_client_secret = ""

[messaging]
# 出来事を出す SNS の FIFO トピック(AWS)。ローカルはトピックの代わりに publish_queue_urls へ直接送る
topic_arn = ""
publish_queue_urls = []
# 勤怠(timesheet)の出来事を受け取るキュー
inbox_queue_url = ""
# ローカル(ElasticMQ)だけ指定する
sqs_endpoint = ""
relay_interval_ms = 500

[payout]
# logging | bank
provider = "bank"
base_url = ""
# シークレット。ローカル以外は api_key_secret_id で与える
api_key = ""
api_key_secret_id = ""
# 振込の依頼を受けるキュー。AWS では Lambda のイベントソースが読むので、ローカルのポーラーだけが使う
queue_url = ""

[secrets]
# 指定すると起動時に Secrets Manager から取る(AWS では Terraform が環境変数で渡す)
database_url_secret_id = ""
# migrate だけが使う。指定すると管理者でデータベースを用意してマイグレーションし、その後アプリ用のユーザー
# (このデータベースの読み書きだけ)を作る。空ならアプリと同じ接続でマイグレーションだけを流す(ローカル)
database_admin_secret_id = ""
database_app_user_secret_id = ""

[telemetry]
otlp_endpoint = ""
json_logs = true
log_filter = "info"
# 新しく始まるトレースのうち送る割合(0.0〜1.0)。量が増えたら prd で下げる
sample_ratio = 1.0
