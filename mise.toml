# ツール版数・環境変数・タスクをここに集約する。Rust 本体は rust-toolchain.toml に任せる
[tools]
node = "24.21.0"
pnpm = "12.4.2"
terraform = "1.16.3"
buf = "1.73.0"
tflint = "0.64.0"
trivy = "0.74.0"
lefthook = "2.1.14"
gitleaks = "8.30.1"
hadolint = "2.15.1"
"github:reteps/dockerfmt" = "0.5.4"
actionlint = "1.7.12"
grpcurl = "1.9.4"
jq = "1.8.2"
cargo-binstall = "1.23.0"
"cargo:cargo-lambda" = "1.9.2"
# 既定機能は native-tls(libssl-dev が要る)なので、MySQL + rustls に絞ってビルドする
"cargo:sqlx-cli" = { version = "0.9.0", default-features = false, features = "mysql,rustls,completions" }
"cargo:cargo-nextest" = "0.9.145"
"cargo:cargo-llvm-cov" = "0.9.1"
"cargo:cargo-deny" = "0.20.2"

[settings]
# cargo: バックエンドはソースビルドせず cargo-binstall でバイナリを取る
cargo.binstall = true

[env]
APP_ENV = "local"
# query! は既定でコミット済みの .sqlx/ を使う。DATABASE_URL があると live DB を見に行き、
# 空の DB では migrate 自体がビルドできなくなるため
SQLX_OFFLINE = "true"
# sqlx-cli・migrate の接続先。worktree では .env の値が上書きする
DATABASE_URL = "mysql://platform:platform@127.0.0.1:3306/platform"
# ローカル用のダミー認証情報。worktree では、worktree:new がその worktree のポートと接続先(APP__…)を追記する。
# main では APP__… を渡さないので、server の接続先は config/local.toml の値になる
_.file = ".env"

[tasks.gen]
description = "protoからRust・TSを生成(変更がなければスキップ)"
sources = ["proto/**/*.proto", "buf.yaml", "buf.gen.yaml"]
outputs = ["backend/gen/src/gen/**/*.rs", "frontend/packages/api-client/src/gen/**/*.ts"]
run = "buf generate"

[tasks.dev-backend]
description = "gRPCサーバーを起動"
run = "cargo run -p server"

[tasks.dev-frontend]
description = "Viteの開発サーバーを起動"
run = "pnpm --filter web dev"

# マイグレーションは sqlx-cli で当てる。列を足して query! も変えたときは、キャッシュが古いままなので
# infrastructure に依存する migrate がビルドできない
[tasks.sqlx-prepare]
description = "未適用のマイグレーションを当ててから、query! のオフラインキャッシュ(.sqlx/)を更新する"
run = ["sqlx migrate run --source backend/contexts/payroll/infrastructure/migrations", "cargo sqlx prepare --workspace"]
env = { SQLX_OFFLINE = "false" }

[tasks.migrate]
description = "マイグレーションを実行"
run = "cargo run -p migrate"

[tasks.test]
description = "Rust(nextest)とフロントのテスト"
depends = ["test:rust", "test:ts"]

[tasks."test:rust"]
# nextest は doc テストを実行しないので、cargo test --doc を別に回す
run = ["cargo nextest run --workspace", "cargo test --doc --workspace --quiet"]

[tasks.smoke]
description = "起動中の server に grpcurl で主要シナリオを流す(本物の JWT と組み立てを通す)"
run = "scripts/smoke-test.sh"

[tasks.coverage]
description = "Rust のテストのカバレッジ(target/llvm-cov/html に HTML を出す)"
run = "cargo llvm-cov nextest --workspace --html"

[tasks."test:ts"]
# E2E は mise run e2e で別に回す(依存サービスと server が要る)
run = "pnpm -r --filter '!e2e' --if-present test"

[tasks."worktree:new"]
description = "worktree を作り、専用の依存サービス(compose)とポートを割り当てる(例: mise run worktree:new -- feature-x)"
run = "scripts/worktree.sh new"

[tasks."worktree:remove"]
description = "worktree と、その依存サービス(データも)を片付ける(例: mise run worktree:remove -- feature-x)"
run = "scripts/worktree.sh remove"

[tasks."worktree:list"]
description = "worktree ごとのスロットとポートを一覧する"
run = "scripts/worktree.sh list"

[tasks."deps:up"]
description = "この worktree の依存サービス(compose)を起動し、使えるようになるまで待つ"
run = "docker compose up -d --wait"

[tasks."deps:stop"]
description = "この worktree の依存サービス(compose)を止める。データは残る"
run = "docker compose stop"

[tasks."deps:logs"]
description = "依存サービスのログを追う(例: mise run deps:logs -- keycloak)"
run = "docker compose logs -f"

[tasks."db:reset"]
description = "DB と Keycloak を空にして作り直し、マイグレーションを流す(Keycloak はボリュームがないので必ず一緒に消す)"
run = ["docker compose down --volumes", "docker compose up -d --wait", "cargo run -p migrate"]

[tasks."e2e:prepare"]
description = "E2E の依存サービスを起動してマイグレーション"
run = ["docker compose up -d --wait mysql keycloak elasticmq", "cargo run -p migrate"]

[tasks.e2e]
description = "DB起動・マイグレーション後にPlaywright"
depends = ["e2e:prepare"]
run = "pnpm --filter e2e test"

# 画面を見ながら動かす。引数は Playwright に渡る(例: mise run e2e:headed -- -g 作成中)
[tasks."e2e:ui"]
description = "Playwright の UI モード(テストの一覧・手順ごとの画面を見ながら実行)"
depends = ["e2e:prepare"]
run = "pnpm --filter e2e exec playwright test --ui"

[tasks."e2e:headed"]
description = "ブラウザを表示して実行。E2E_SLOW_MO(ミリ秒)で操作を遅くできる(既定 500)"
depends = ["e2e:prepare"]
env = { E2E_SLOW_MO = "{{ get_env(name='E2E_SLOW_MO', default='500') }}" }
run = "pnpm --filter e2e exec playwright test --headed --workers=1"

[tasks."e2e:debug"]
description = "Playwright Inspector で1手順ずつ止めながら実行"
depends = ["e2e:prepare"]
run = "pnpm --filter e2e exec playwright test --debug"

[tasks."e2e:report"]
description = "直近の実行結果(失敗時のトレース)を見る"
run = "pnpm --filter e2e exec playwright show-report"

[tasks.lint]
description = "全言語のlintを並列実行"
depends = [
  "lint:rust",
  "lint:ts",
  "lint:css",
  "lint:deps",
  "lint:proto",
  "lint:tf",
  "lint:docker",
  "lint:actions",
  "lint:secrets",
]

[tasks."lint:rust"]
run = [
  "cargo fmt --all --check",
  "cargo clippy --workspace --all-targets -- -D warnings",
  "cargo deny check",
  "scripts/check-deps.sh",
]

[tasks."lint:ts"]
run = ["pnpm oxfmt --check", "pnpm oxlint", "pnpm -r --if-present typecheck"]

# CSS の層ごとの決まり(stylelint)と、ファイルをまたぐ決まり(層の順・変数の定義・TSX のクラスとの対応)
[tasks."lint:css"]
run = ["pnpm stylelint 'frontend/**/*.css'", "pnpm --filter @platform/ui check:styles"]

# フロントエンドの依存の向き(.dependency-cruiser.cjs)
[tasks."lint:deps"]
run = "pnpm depcruise frontend e2e --output-type err"

# utilities.css からクラス名の型(packages/ui/src/utilities.gen.ts)を作る
[tasks."gen:styles"]
run = "pnpm --filter @platform/ui gen:styles"

[tasks."lint:proto"]
# breaking は main と比べる(v1 の中でフィールドの番号・型・意味を変えていないか)。main の上では自分と比べるので必ず通る
run = ["buf format --diff --exit-code", "buf lint", "buf breaking --against '.git#branch=main'"]

[tasks."lint:tf"]
dir = "infra"
run = [
  "terraform fmt -check -recursive",
  "tflint --init --config \"$PWD/.tflint.hcl\"",
  "tflint --recursive --config \"$PWD/.tflint.hcl\"",
  # bootstrap はバケット名を tfvars から for_each に使うので、値を渡さないとバケットごとの設定を見分けられない
  "trivy config --quiet --exit-code 1 --severity HIGH,CRITICAL --ignorefile .trivyignore.yaml --tf-vars bootstrap/terraform.tfvars .",
  # 型・参照・モジュールの引数の誤りは fmt や tflint では見つからない。state には触れない(-backend=false)
  "for dir in envs/*/ bootstrap/; do terraform -chdir=\"$dir\" init -backend=false -input=false >/dev/null && terraform -chdir=\"$dir\" validate -no-color || exit 1; done",
]

[tasks."lint:actions"]
run = "actionlint"

[tasks."lint:docker"]
run = [
  "hadolint backend/app/server/Dockerfile",
  "dockerfmt --check backend/app/server/Dockerfile",
  "trivy config --quiet --exit-code 1 --severity HIGH,CRITICAL backend/app/server/Dockerfile",
]

[tasks."lint:secrets"]
run = "gitleaks dir . --config .gitleaks.toml --no-banner"

[tasks.fmt]
description = "全言語を整形"
run = ["cargo fmt --all", "pnpm oxfmt", "buf format -w", "terraform fmt -recursive infra"]

[tasks.lambda-build]
description = "cargo-lambdaでzipを作成"
run = "cargo lambda build --release --arm64 --output-format zip -p payout-dispatcher"

[tasks.tf-plan]
description = "dev環境のterraform plan(環境ごとの値は terraform.tfvars、版は今のコミット)"
dir = "infra/envs/dev"
run = [
  "terraform init -input=false",
  "terraform plan -input=false -var=image_tag=$(git rev-parse HEAD) -var=lambda_artifact_key=payout-dispatcher/$(git rev-parse HEAD).zip",
]
