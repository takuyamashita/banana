name: backend

# GitHub Actions の実行時間を節約するため、いったん手動実行だけにしている(2026-09-19)。
# 元に戻すときは下のコメントを外し、その下の on: を消す
# on:
#   pull_request:
#     paths:
#       [
#         "backend/**",
#         "proto/**",
#         "Cargo.toml",
#         "Cargo.lock",
#         ".sqlx/**",
#         "deny.toml",
#         "clippy.toml",
#         "rustfmt.toml",
#         "mise.toml",
#         "rust-toolchain.toml",
#         "scripts/check-deps.sh",
#         "compose/mysql-init.sql",
#         ".github/workflows/backend.yml",
#       ]
#   push:
#     branches: [main]
#     paths:
#       [
#         "backend/**",
#         "proto/**",
#         "Cargo.toml",
#         "Cargo.lock",
#         ".sqlx/**",
#         "mise.toml",
#         "rust-toolchain.toml",
#         ".github/workflows/backend.yml",
#       ]
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust:
    runs-on: ubuntu-24.04
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: root
        ports: ["3306:3306"]
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -proot --silent"
          --health-interval=5s --health-timeout=3s --health-retries=20
    env:
      APP_ENV: local
      PAYROLL_DATABASE_URL: mysql://payroll:payroll@127.0.0.1:3306/payroll
      TIMESHEET_DATABASE_URL: mysql://timesheet:timesheet@127.0.0.1:3306/timesheet
    steps:
      - uses: actions/checkout@v7.0.1
      # mise は cargo 系ツールを並列に入れるので、rust-toolchain.toml の版を先に入れておく
      # (入れていないと各 cargo が同時にツールチェーンを取りに行き、rustup のダウンロードが競合する)
      - run: rustup toolchain install
      - uses: jdx/mise-action@v4.3.0
      - uses: Swatinem/rust-cache@v2
      - name: lint(fmt・clippy・cargo-deny・依存ルール)
        run: mise run lint:rust
      - name: .sqlx が最新か(query! のオフラインキャッシュ)
        run: |
          # サービスごとのデータベースとユーザー(ローカルの compose と同じもの)
          mysql -h 127.0.0.1 -uroot -proot < compose/mysql-init.sql
          sqlx migrate run --source backend/contexts/payroll/infrastructure/migrations --database-url "$PAYROLL_DATABASE_URL"
          sqlx migrate run --source backend/contexts/timesheet/infrastructure/migrations --database-url "$TIMESHEET_DATABASE_URL"
          SQLX_OFFLINE=false DATABASE_URL="$PAYROLL_DATABASE_URL" cargo sqlx prepare --workspace --check
      - name: test(nextest。DB 結合・API テストは testcontainers)
        run: mise run test:rust
        env:
          NEXTEST_PROFILE: ci
      - name: Dockerfile
        run: mise run lint:docker
