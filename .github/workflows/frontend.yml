name: frontend

# GitHub Actions の実行時間を節約するため、いったん手動実行だけにしている(2026-09-19)。
# 元に戻すときは下のコメントを外し、その下の on: を消す
# on:
#   pull_request:
#     paths:
#       [
#         "frontend/**",
#         "proto/**",
#         "package.json",
#         "pnpm-lock.yaml",
#         ".oxlintrc.json",
#         ".oxfmtrc.json",
#         "mise.toml",
#         ".github/workflows/frontend.yml",
#       ]
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7.0.1
      # mise は cargo 系ツールを並列に入れるので、rust-toolchain.toml の版を先に入れておく
      # (入れていないと各 cargo が同時にツールチェーンを取りに行き、rustup のダウンロードが競合する)
      - run: rustup toolchain install
      - uses: jdx/mise-action@v4.3.0
      - run: pnpm install --frozen-lockfile
      - name: lint(oxfmt・oxlint・tsc)
        run: mise run lint:ts
      - name: test(Vitest)
        run: mise run test:ts
      - name: build
        run: pnpm --filter web build
