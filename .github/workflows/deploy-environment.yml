name: deploy-environment

# deploy.yml から環境ごとに呼ぶ。build ジョブが作った成果物(release)を、その環境に置いて切り替える。
#
# plan と apply を分ける。plan は読み取りのロールで作ってジョブの概要に出し、
# 承認者はそれを見てから deploy ジョブ(GitHub Environment「<環境>」。stg・prod は承認が要る)を通す。
# apply するのは承認した plan そのもの。その間に state が変わっていれば apply は失敗する(plan からやり直す)
on:
  workflow_call:
    inputs:
      environment:
        description: デプロイ先(dev・stg・prod)
        type: string
        required: true

permissions:
  contents: read
  id-token: write

jobs:
  plan:
    runs-on: ubuntu-24.04-arm
    environment: ${{ inputs.environment }}-plan
    env:
      ENV_DIR: infra/envs/${{ inputs.environment }}
      VERSION: ${{ github.sha }}
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: jdx/mise-action@v4.3.0
        with:
          install_args: terraform
      - uses: aws-actions/configure-aws-credentials@v6.3.0
        with:
          role-to-assume: ${{ vars.AWS_PLAN_ROLE_ARN }}
          aws-region: ap-northeast-1
      # 秘密でない環境ごとの値は terraform.tfvars(自動で読まれる)、デプロイのたびに変わる値だけここで渡す
      - name: terraform plan
        working-directory: ${{ env.ENV_DIR }}
        run: |
          terraform init -input=false
          terraform plan -input=false -out=tfplan \
            -var="image_tag=$VERSION" \
            -var="lambda_artifact_key=payout-dispatcher/$VERSION.zip"
          {
            echo "### terraform plan (${{ inputs.environment }})"
            echo '```'
            terraform show -no-color tfplan | tail -c 60000
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      # plan のファイルにはシークレットの値も入りうる。承認と apply の間だけ持つ
      - uses: actions/upload-artifact@v7.0.1
        with:
          name: tfplan-${{ inputs.environment }}
          path: ${{ env.ENV_DIR }}/tfplan
          retention-days: 1

  deploy:
    needs: plan
    runs-on: ubuntu-24.04-arm
    environment: ${{ inputs.environment }}
    concurrency:
      group: deploy-${{ inputs.environment }}
      cancel-in-progress: false
    env:
      ENV_DIR: infra/envs/${{ inputs.environment }}
      VERSION: ${{ github.sha }}
    steps:
      - uses: actions/checkout@v7.0.1
      # ここで使うのは terraform だけ(aws・jq・docker はランナーに入っている)
      - uses: jdx/mise-action@v4.3.0
        with:
          install_args: terraform
      # アクセスキーは使わず、GitHub OIDC で環境ごとの IAM ロールを引き受ける
      - uses: aws-actions/configure-aws-credentials@v6.3.0
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ap-northeast-1
      - uses: actions/download-artifact@v8.0.1
        with:
          name: release
          path: release
      - uses: actions/download-artifact@v8.0.1
        with:
          name: tfplan-${{ inputs.environment }}
          path: ${{ env.ENV_DIR }}

      - name: Terraform の出力を読む
        id: tf
        working-directory: ${{ env.ENV_DIR }}
        run: |
          terraform init -input=false
          for key in ecs_cluster_name services lambda_artifact_bucket web_bucket_name web_distribution_id; do
            echo "$key=$(terraform output -raw $key)" >> "$GITHUB_OUTPUT"
          done

      # ECR のタグは IMMUTABLE なので、同じ版を2回 push すると失敗する。
      # 既にあれば置かない(再実行やロールバックでは、前に置いたイメージをそのまま使う)
      - name: server イメージを ECR に置く(サービスごと)
        env:
          SERVICES: ${{ steps.tf.outputs.services }}
        run: |
          for service in $(jq -r 'keys[]' <<<"$SERVICES"); do
            repo_url=$(jq -r --arg s "$service" '.[$s].ecr_repository_url' <<<"$SERVICES")
            if aws ecr describe-images --repository-name "${repo_url#*/}" --image-ids imageTag="$VERSION" >/dev/null 2>&1; then
              echo "$repo_url:$VERSION は既にあるので置かない"
              continue
            fi
            aws ecr get-login-password | docker login --username AWS --password-stdin "${repo_url%%/*}"
            gunzip -c "release/$service-image.tar.gz" | docker load
            docker tag "$service:$VERSION" "$repo_url:$VERSION"
            docker push "$repo_url:$VERSION"
          done

      - name: Lambda の zip を S3 に置く
        env:
          BUCKET: ${{ steps.tf.outputs.lambda_artifact_bucket }}
        run: |
          key="payout-dispatcher/$VERSION.zip"
          if aws s3api head-object --bucket "$BUCKET" --key "$key" >/dev/null 2>&1; then
            echo "s3://$BUCKET/$key は既にあるので置かない"
            exit 0
          fi
          aws s3 cp release/payout-dispatcher.zip "s3://$BUCKET/$key"

      # run-task の overrides ではイメージを差し替えられない(containerOverrides に image はない)。
      # 今のタスク定義のイメージだけを新しい版にしたリビジョンを登録し、それで流す。サービスごとに流し、1つでも失敗したら止める
      - name: migrate(サービスごとの ECS 単発タスク)。失敗したらここで止める
        env:
          CLUSTER: ${{ steps.tf.outputs.ecs_cluster_name }}
          SERVICES: ${{ steps.tf.outputs.services }}
        run: |
          for service in $(jq -r 'keys[]' <<<"$SERVICES"); do
            get() { jq -r --arg s "$service" --arg k "$1" '.[$s][$k]' <<<"$SERVICES"; }
            image="$(get ecr_repository_url):$VERSION"
            aws ecs describe-task-definition --task-definition "$(get migrate_task_definition_arn)" --query taskDefinition \
              | jq --arg image "$image" -f .github/deploy/migrate-task-definition.jq > migrate-task-definition.json
            task_definition=$(aws ecs register-task-definition --cli-input-json file://migrate-task-definition.json \
              --query taskDefinition.taskDefinitionArn --output text)
            task_arn=$(aws ecs run-task --cluster "$CLUSTER" --task-definition "$task_definition" \
              --launch-type FARGATE --network-configuration "$(get migrate_network_configuration)" \
              --query 'tasks[0].taskArn' --output text)
            aws ecs wait tasks-stopped --cluster "$CLUSTER" --tasks "$task_arn"
            code=$(aws ecs describe-tasks --cluster "$CLUSTER" --tasks "$task_arn" \
              --query 'tasks[0].containers[0].exitCode' --output text)
            echo "$service migrate exit code: $code"
            test "$code" = "0"
          done

      - name: terraform apply(承認した plan で、サービス更新・Lambda 更新)
        working-directory: ${{ env.ENV_DIR }}
        run: terraform apply -input=false tfplan

      # apply はタスクの入れ替えを待たずに終わる。新しいタスクが起動できないまま次に進まないよう、安定するまで待つ
      - name: server の入れ替えが終わるのを待つ(全サービス)
        env:
          SERVICES: ${{ steps.tf.outputs.services }}
        run: |
          # shellcheck disable=SC2046 # サービス名を別々の引数として渡す
          aws ecs wait services-stable --cluster "${{ steps.tf.outputs.ecs_cluster_name }}" \
            --services $(jq -r '[.[].ecs_service_name] | join(" ")' <<<"$SERVICES")

      # assets/ を先に置いてから index.html を差し替える(新しい index.html が、まだない assets/ を指さないように)。
      # 古い assets/ は消さない。前の index.html を開いたままの画面が、後から読みに来る。
      # config.json は Terraform が置くので触らない
      - name: フロントを S3 + CloudFront に配信
        env:
          BUCKET: ${{ steps.tf.outputs.web_bucket_name }}
        run: |
          aws s3 sync release/web/assets "s3://$BUCKET/assets" --cache-control "public, max-age=31536000, immutable"
          aws s3 sync release/web "s3://$BUCKET" --exclude "assets/*" --exclude config.json --cache-control "no-cache"
          aws cloudfront create-invalidation --distribution-id "${{ steps.tf.outputs.web_distribution_id }}" --paths "/" "/index.html"
