name: deploy

# 1回ビルドした成果物(server イメージ・Lambda の zip・フロント)を、dev → stg → prod の順に昇格させる。
# stg・prod は GitHub Environments の承認を経る。どの環境まで進めるかは through で選ぶ。
# 同じ版(git sha)をもう一度デプロイすると、ECR・S3 に既にある成果物をそのまま使う(再実行・ロールバック)。
# 古い版に戻すときは、その版のタグを指定して実行する。
#
# GitHub Actions の実行時間を節約するため、いったん手動実行だけにしている(2026-09-19)。
# 元に戻すときは下のコメントを外し、その下の on: を消す
# on:
#   push:
#     branches: [main]
#   workflow_dispatch:
#     inputs:
#       through:
#         description: どの環境まで昇格させるか
#         type: choice
#         options: [dev, stg, prod]
on:
  workflow_dispatch:
    inputs:
      through:
        description: どの環境まで昇格させるか
        type: choice
        options: [dev, stg, prod]

permissions:
  contents: read

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  build:
    # main かタグからだけデプロイする(機能ブランチを誤って本番に出さない)
    if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v7.0.1
      # mise は cargo 系ツールを並列に入れるので、rust-toolchain.toml の版を先に入れておく
      # (入れていないと各 cargo が同時にツールチェーンを取りに行き、rustup のダウンロードが競合する)
      - run: rustup toolchain install
      - uses: jdx/mise-action@v4.3.0

      - name: server イメージ(cargo-chef)をビルド
        run: |
          docker build -f backend/app/server/Dockerfile -t "server:$GITHUB_SHA" .
          mkdir -p release
          docker save "server:$GITHUB_SHA" | gzip > release/server-image.tar.gz

      - name: Lambda の zip をビルド
        run: |
          mise run lambda-build
          cp target/lambda/payout-dispatcher/bootstrap.zip release/payout-dispatcher.zip

      - name: フロントをビルド(config.json は環境ごとに Terraform が置くので含めない)
        run: |
          pnpm install --frozen-lockfile
          pnpm --filter web build
          rm -f frontend/apps/web/dist/config.json
          cp -r frontend/apps/web/dist release/web

      - uses: actions/upload-artifact@v7.0.1
        with:
          name: release
          path: release/
          retention-days: 30

  dev:
    needs: build
    uses: ./.github/workflows/deploy-environment.yml
    with:
      environment: dev
    permissions:
      contents: read
      id-token: write

  stg:
    needs: dev
    if: inputs.through == 'stg' || inputs.through == 'prod'
    uses: ./.github/workflows/deploy-environment.yml
    with:
      environment: stg
    permissions:
      contents: read
      id-token: write

  prod:
    needs: stg
    if: inputs.through == 'prod'
    uses: ./.github/workflows/deploy-environment.yml
    with:
      environment: prod
    permissions:
      contents: read
      id-token: write
