name: security

# 依存の脆弱性は、コードを変えていなくても後から公表される。変更のたびではなく定期的に確かめる。
# GitHub Actions の実行時間を節約するため、いったん手動実行だけにしている(2026-09-19)。
# 元に戻すときは下のコメントを外し、その下の on: を消す
# on:
#   schedule:
#     - cron: "0 0 * * 1" # 毎週月曜 9:00(JST)
#   workflow_dispatch:
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  scan:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          # 秘密情報は履歴全体を見る(消したコミットにも残っている)
          fetch-depth: 0
      # mise は cargo 系ツールを並列に入れるので、rust-toolchain.toml の版を先に入れておく
      # (入れていないと各 cargo が同時にツールチェーンを取りに行き、rustup のダウンロードが競合する)
      - run: rustup toolchain install
      - uses: jdx/mise-action@v4.3.0
      - name: 秘密情報(履歴全体)
        run: gitleaks git . --config .gitleaks.toml --no-banner
      - name: Rust の依存の脆弱性
        run: cargo deny check advisories
      - name: フロントの依存の脆弱性(配信するものだけ)
        run: |
          pnpm install --frozen-lockfile
          pnpm audit --prod
      - name: ワークフローの誤り
        run: actionlint
