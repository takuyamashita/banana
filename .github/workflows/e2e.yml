name: e2e

# GitHub Actions の実行時間を節約するため、いったん手動実行だけにしている(2026-09-19)。
# 元に戻すときは下のコメントを外し、その下の on: を消す
# on:
#   pull_request:
#     paths:
#       [
#         "backend/**",
#         "frontend/**",
#         "proto/**",
#         "e2e/**",
#         "compose.yaml",
#         "compose/**",
#         "mise.toml",
#         "rust-toolchain.toml",
#         ".github/workflows/e2e.yml",
#       ]
#   push:
#     branches: [main]
#   schedule:
#     - cron: "0 18 * * *" # 毎日 03:00 JST に全件
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  playwright:
    runs-on: ubuntu-24.04
    env:
      APP_ENV: local
    steps:
      - uses: actions/checkout@v7.0.1
      # mise は cargo 系ツールを並列に入れるので、rust-toolchain.toml の版を先に入れておく
      # (入れていないと各 cargo が同時にツールチェーンを取りに行き、rustup のダウンロードが競合する)
      - run: rustup toolchain install
      - uses: jdx/mise-action@v4.3.0
      - uses: Swatinem/rust-cache@v2
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter e2e exec playwright install --with-deps chromium
      - name: 依存サービス起動・マイグレーション・E2E
        run: mise run e2e
      - uses: actions/upload-artifact@v7.0.1
        if: failure()
        with:
          name: playwright-report
          path: e2e/test-results
