name: infra

# GitHub Actions の実行時間を節約するため、いったん手動実行だけにしている(2026-09-19)。
# 元に戻すときは下のコメントを外し、その下の on: を消す
# on:
#   pull_request:
#     paths: ["infra/**", "mise.toml", ".github/workflows/infra.yml"]
on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write
  pull-requests: write

jobs:
  lint:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7.0.1
      # mise は cargo 系ツールを並列に入れるので、rust-toolchain.toml の版を先に入れておく
      # (入れていないと各 cargo が同時にツールチェーンを取りに行き、rustup のダウンロードが競合する)
      - run: rustup toolchain install
      - uses: jdx/mise-action@v4.3.0
      - run: mise run lint:tf
        env:
          GITHUB_TOKEN: ${{ github.token }}

  plan:
    runs-on: ubuntu-24.04
    needs: lint
    environment: dev-plan
    steps:
      - uses: actions/checkout@v7.0.1
      # mise は cargo 系ツールを並列に入れるので、rust-toolchain.toml の版を先に入れておく
      # (入れていないと各 cargo が同時にツールチェーンを取りに行き、rustup のダウンロードが競合する)
      - run: rustup toolchain install
      - uses: jdx/mise-action@v4.3.0
      - uses: aws-actions/configure-aws-credentials@v6.3.0
        with:
          role-to-assume: ${{ vars.AWS_PLAN_ROLE_ARN }}
          aws-region: ap-northeast-1
      - name: terraform plan(dev)
        working-directory: infra/envs/dev
        run: |
          terraform init -input=false
          terraform plan -input=false -no-color -var-file=ci.tfvars -var="image_tag=${{ github.sha }}" > plan.txt
      - name: PR にコメント
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          {
            echo '### terraform plan (dev)'
            echo '```'
            tail -c 60000 infra/envs/dev/plan.txt
            echo '```'
          } > comment.md
          gh pr comment "${{ github.event.pull_request.number }}" --body-file comment.md --edit-last --create-if-none
